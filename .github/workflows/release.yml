# .github/workflows/release.yml
name: release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: write
      # Azure federated login and Sigstore signing of build provenance.
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          # Keep the release toolchain in lockstep with the `go` directive in
          # go.mod; released binaries embed this toolchain's standard library.
          go-version-file: go.mod
      - name: Install syft
        run: make -s install-syft >> "$GITHUB_PATH"
      - name: Azure Login (Federated Identity)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Set up Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Install osslsigncode
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends osslsigncode
      - name: Download Microsoft root CA
        env:
          # SHA256 digest of the DER certificate published by Microsoft PKI.
          ROOT_CA_SHA256: 5367f20c7ade0e2bca790915056d086b720c33c1fa2a2661acf787e3292e1270
        run: |
          curl -fsSL -o "$RUNNER_TEMP/ms-root-ca.crt" \
            "https://www.microsoft.com/pkiops/certs/microsoft%20identity%20verification%20root%20certificate%20authority%202020.crt"
          echo "${ROOT_CA_SHA256}  $RUNNER_TEMP/ms-root-ca.crt" | sha256sum -c -
          openssl x509 -inform DER -in "$RUNNER_TEMP/ms-root-ca.crt" -out "$RUNNER_TEMP/ms-root-ca.pem"
      - name: Download jsign
        env:
          JSIGN_VERSION: "7.6"
          # SHA256 digest of the jsign-7.6.jar asset on the upstream GitHub release.
          JSIGN_SHA256: 6cf58aa080e7ff82656f320cff8d4a3bff30408df8766806dcba3740dd839fa5
        run: |
          curl -fsSL -o "$RUNNER_TEMP/jsign.jar" \
            "https://github.com/ebourg/jsign/releases/download/${JSIGN_VERSION}/jsign-${JSIGN_VERSION}.jar"
          echo "${JSIGN_SHA256}  $RUNNER_TEMP/jsign.jar" | sha256sum -c -
      - name: Get Azure Trusted Signing access token
        id: ats
        run: |
          token="$(az account get-access-token --resource https://codesigning.azure.net --query accessToken -o tsv)"
          if [ -z "$token" ]; then
            echo "::error::Empty Azure Trusted Signing access token"
            exit 1
          fi
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
      - name: Read GoReleaser version from Makefile
        id: goreleaser-version
        run: |
          v="$(make -s print-goreleaser-version)"
          test -n "$v"
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: ${{ steps.goreleaser-version.outputs.version }}
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SWO_ISSUER_ID: ${{ secrets.SWO_ISSUER_ID }}
          SWO_KEY_ID: ${{ secrets.SWO_KEY_ID }}
          SWO_MAC_P8_FILE: ${{ secrets.SWO_MAC_P8_FILE }}
          SWO_MAC_P12_CERT: ${{ secrets.SWO_MAC_P12_CERT }}
          SWO_P12_PASSWORD: ${{ secrets.SWO_P12_PASSWORD }}
          ATS_ACCESS_TOKEN: ${{ steps.ats.outputs.token }}
          ATS_ENDPOINT: ${{ vars.ATS_ENDPOINT }}
          ATS_ACCOUNT: ${{ vars.ATS_ACCOUNT }}
          ATS_CERT_PROFILE: ${{ vars.ATS_CERT_PROFILE }}
          ATS_ROOT_CA: ${{ runner.temp }}/ms-root-ca.pem
          JSIGN_JAR: ${{ runner.temp }}/jsign.jar
          REQUIRE_SIGNING: "1"
      - name: Attest build provenance of released artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/swo-cli_checksums.txt
      - name: Attest build provenance of checksums file
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/swo-cli_checksums.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
