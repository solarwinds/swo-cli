version: 2

# Pinned so artifact names (and the attestation subject in release.yml) do not depend on the git remote.
project_name: swo-cli

env:
  - CGO_ENABLED=0
  - REPO_OWNER=solarwinds
  - REPO_NAME=swo-cli

builds:
  - main: ./cmd/swo/main.go
    id: linux
    binary: swo
    ldflags:
      - "-s -w -X 'main.version=v{{ .Version }}'"
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
  - main: ./cmd/swo/main.go
    id: win
    binary: swo
    ldflags:
      - "-s -w -X 'main.version=v{{ .Version }}'"
    targets:
      - windows_amd64
    hooks:
      post:
        # Authenticode-signs swo.exe before it is archived and checksummed.
        - cmd: ./scripts/sign-windows.sh "{{ .Path }}"
          output: true

archives:
  - ids:
      - win
      - linux
      - mac
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - zip

universal_binaries:
  - id: mac
    ids:
      - "linux"
    replace: true
    name_template: "swo"

notarize:
  macos:
    - enabled: '{{ isEnvSet "SWO_MAC_P12_CERT" }}'
      ids:
        - mac
      sign:
        certificate: "{{.Env.SWO_MAC_P12_CERT}}"
        password: "{{.Env.SWO_P12_PASSWORD}}"

      notarize:
        issuer_id: "{{.Env.SWO_ISSUER_ID}}"
        key_id: "{{.Env.SWO_KEY_ID}}"
        key: "{{.Env.SWO_MAC_P8_FILE}}"
        wait: true
        timeout: 20m

# Published by the workflow once build provenance is attested.
release:
  draft: true
  replace_existing_draft: true

checksum:
  name_template: '{{ .ProjectName }}_checksums.txt'

# One SPDX SBOM per archive, generated by syft and included in the checksums file.
sboms:
  - artifacts: archive

changelog:
  sort: asc
  groups:
    - title: Breaking changes
      regexp: '^.*?\w+(\(.+\))??!:.+$'
      order: 0
    - title: Features
      regexp: '^.*?feat(\(.+\))??:.+$'
      order: 1
    - title: Bug fixes
      regexp: '^.*?fix(\(.+\))??:.+$'
      order: 2
    - title: Dependencies
      regexp: '^.*?\(deps\):.+$'
      order: 3
    - title: Other
      order: 999
  filters:
    exclude:
      - '^chore(\(.+\))?: bump version'
      - '^docs(\(.+\))?:'
      - '^test(\(.+\))?:'
      - '^ci(\(.+\))?:'
